    - obs space:
        name: gnssrobndnbam_cosmic2
        obsdatain:
          engine:
            type: H5File
            obsfile: ./obs/obs.20240224.t00z.gnssro_cosmic2.nc
            missing file action: warn
          obsgrouping:
            group variables:
            - sequenceNumber
            sort variable: impactHeightRO
            sort order: ascending
        obsdataout:
          engine:
            type: H5File
            obsfile: ./output/diag.gnssro_cosmic2_2024022400.nc
        simulated variables:
        - bendingAngle
      obs operator:
        name: GnssroBndNBAM
        obs options:
          use_compress: 1
          sr_steps: 2
          vertlayer: full
          super_ref_qc: NBAM
          output_diags: true
      obs filters:
      - filter: Create Diagnostic Flags
        filter variables:
        - name: bendingAngle
        flags:
        - name: pccfCheckReject
          initial value: false
          force reinitialization: true
      - filter: Bounds Check
        filter variables:
        - name: bendingAngle
        where:
        - variable:
            name: MetaData/satelliteIdentifier
          is_in: 265-269,750-755,44,786,820,825
        test variables:
        - name: MetaData/pccf
        minvalue: 0.1
        maxvalue: 100.1
        actions:
        - name: set
          flag: pccfCheckReject
        - name: reject
      - filter: Domain Check
        filter variables:
        - name: bendingAngle
        where:
        - variable:
            name: MetaData/impactHeightRO
          minvalue: 0
          maxvalue: 55000.1
        action:
          name: reject
      - filter: Background Check RONBAM
        filter variables:
        - name: bendingAngle
        action:
          name: reject
        defer to post: true
      - filter: ROobserror
        filter variables:
        - name: bendingAngle
        errmodel: NBAM
        defer to post: true
      - filter: Perform Action
        filter variables:
        - name: bendingAngle
        action:
          name: RONBAMErrInflate
        defer to post: true
